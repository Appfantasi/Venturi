name: Build WordQuiz Pro

on:
  push:
    branches: [main]
    tags: ['v*']          # 👈 FONDAMENTALE: attiva la build anche sui tag v1.0.0, v1.1.0...
  workflow_dispatch:

# Evita due deploy contemporanei della PWA che si sovrascrivono
concurrency:
  group: wordquiz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ═══════════════════════════════════════════════════════════════
  # JOB 1: PWA → GitHub Pages + artefatto scaricabile
  # ═══════════════════════════════════════════════════════════════
  pwa:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Versione cache del service worker
        run: sed -i "s/wordquiz-v1/wordquiz-${GITHUB_SHA::8}/" www/sw.js

      # 👇 Artefatto PWA scaricabile separatamente (ZIP della cartella www)
      - name: Upload artefatto PWA
        uses: actions/upload-artifact@v4
        with:
          name: WordQuizPro-PWA
          path: www
          if-no-files-found: error

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - id: dep
        uses: actions/deploy-pages@v4

  # ═══════════════════════════════════════════════════════════════
  # JOB 2: ANDROID → WordQuizPro.apk
  # ═══════════════════════════════════════════════════════════════
  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Controllo segreti
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KS" ] || { echo "::error::Manca il secret KEYSTORE_BASE64"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm install

      - run: npx cap add android

      - name: versionCode crescente
        run: sed -i -E "s/versionCode[ =]+1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle

      - run: npx capacitor-assets generate --android

      - run: npx cap sync android

      - name: Compila APK (non firmato)
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Allinea e firma APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out WordQuizPro.apk aligned.apk
          "$BT/apksigner" verify --print-certs WordQuizPro.apk

      # 👈 Verifica che il file esista, altrimenti fallisce in modo chiaro
      - name: Upload artefatto APK
        uses: actions/upload-artifact@v4
        with:
          name: WordQuizPro-APK
          path: WordQuizPro.apk
          if-no-files-found: error

      - name: Pubblica APK nelle Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: WordQuizPro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════
  # JOB 3: WINDOWS → Installer + Portable (.exe)
  # ═══════════════════════════════════════════════════════════════
  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artefatto Windows
        uses: actions/upload-artifact@v4
        with:
          name: WordQuizPro-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Pubblica Windows nelle Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
