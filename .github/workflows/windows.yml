
name: Venturi Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install FFmpeg with vcpkg
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "$env:RUNNER_TEMP\vcpkg"
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV
          & "$env:VCPKG_ROOT\vcpkg.exe" install ffmpeg:x64-windows

      - name: Check Rust workspace
        run: cargo check --workspace

      - name: Build Windows executable
        run: cargo build --release --workspace

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Venturi-Windows
          path: target/release/*.exe
          if-no-files-found: warn
